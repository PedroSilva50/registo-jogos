<title>Registo de Jogos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#0E211A;
    --surface:#153328;
    --surface-2:#1C4133;
    --chalk:#F3EFE6;
    --muted:#8FA79B;
    --gold:#D9A441;
    --gold-dim:#4A3E22;
    --red:#C8493F;
    --red-dim:#3F2320;
    --yellow:#E1C324;
    --green:#4ade80;
    --green-dim:#133320;
    --line:rgba(243,239,230,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{min-height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--chalk);
    font-family:'Inter',sans-serif;
    padding-bottom:76px; padding-top:env(safe-area-inset-top);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
  .mono{font-family:'Roboto Mono',monospace;}
  .app{max-width:520px; margin:0 auto; padding:24px 16px 8px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .topbar h1{font-size:20px; margin:0; color:var(--chalk); font-weight:600;}
  
  .scoreboard{
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:20px 16px; margin-bottom:16px;
  }
  .scoreboard .opponent{font-size:13px; color:var(--muted); font-family:'Inter'; margin-bottom:10px; display:flex; justify-content:space-between;}
  .score-row{display:flex; align-items:center; justify-content:center; gap:18px;}
  .score-block{text-align:center; flex:1;}
  .score-num{font-family:'Roboto Mono',monospace; font-size:44px; font-weight:700; line-height:1;}
  .score-block.scored .score-num{color:var(--gold);}
  .score-block.conceded .score-num{color:var(--red);}
  .score-label{font-size:10px; letter-spacing:0.12em; color:var(--muted); margin-top:6px; font-family:'Oswald'; text-transform:uppercase;}
  .score-sep{font-size:24px; color:var(--muted); font-family:'Roboto Mono';}

  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; border:none; border-radius:10px; padding:14px 10px;
    font-family:'Oswald'; font-size:14px; letter-spacing:0.03em; text-transform:uppercase; font-weight:600;
    cursor:pointer; transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold); color:#241B08;}
  .btn-red{background:var(--red); color:#2B0F0C;}
  .btn-green{background:var(--green); color:#0E211A;}
  .card-mini-btn{
    background:transparent; border-radius:20px; padding:6px 14px;
    font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; cursor:pointer;
  }
  .card-mini-btn.yellow{border:1px solid var(--yellow); color:var(--yellow);}
  .card-mini-btn.red{border:1px solid var(--red); color:var(--red);}
  .card-mini-btn:disabled{opacity:0.35;}
  .chrono-card{text-align:center; margin-bottom:16px;}
  .chrono-time{font-size:36px; font-weight:700; font-family:'Roboto Mono',monospace; color:var(--chalk); letter-spacing:0.02em;}
  .chrono-sub{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin-bottom:8px;}
  .btn-ghost{background:var(--surface-2); color:var(--chalk);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .btn:disabled{opacity:0.4;}

  .panel{
    background:var(--surface-2); border-radius:12px; padding:14px; margin-top:12px; border:1px solid var(--line);
  }
  .panel-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin-bottom:10px;}
  .grid-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .grid-btns.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .grid-btns.cols-4{grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;}
  .chip{
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 8px;
    text-align:center; font-size:13px; font-weight:600; cursor:pointer; color:var(--chalk); transition:all .15s ease;
  }
  .chip:active{background:var(--gold-dim);}
  .chip.chip-sm{padding:9px 4px; font-size:11px; line-height:1.3; word-break:break-word;}
  .chip.absent{background:var(--red-dim); border-color:var(--red); color:var(--red);}
  .chip.active-green { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .chip.active-gold { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'Oswald'; margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:12px; color:var(--chalk); font-family:'Inter'; font-size:15px;
  }
  .field input[type="date"], .field input[type="time"]{ -webkit-appearance:none; appearance:none; text-align:left; }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:80px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .match-head{display:flex; justify-content:space-between; align-items:center;}
  .match-head .opp{font-weight:600; font-size:15px;}
  .match-head .date{font-size:11px; color:var(--muted); margin-top:3px;}
  .match-score{font-family:'Roboto Mono'; font-weight:700; font-size:16px;}
  .match-score .s{color:var(--gold);} .match-score .c{color:var(--red);}
  
  .badge-type, .badge-loc{
    display:inline-block; font-size:9px; padding:2px 6px; border-radius:4px; margin-left:6px; 
    text-transform:uppercase; font-family:'Oswald'; letter-spacing:0.05em;
  }
  .badge-type{background:var(--surface-2); color:var(--muted);}
  .badge-loc.casa{border:1px solid var(--green); color:var(--green);}
  .badge-loc.fora{border:1px solid var(--red); color:var(--red);}
  .badge-open{display:inline-block; font-size:9px; background:var(--gold-dim); color:var(--gold); padding:2px 6px; border-radius:4px; margin-left:6px; text-transform:uppercase; font-family:'Oswald'; letter-spacing:0.05em;}

  .quick-del{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:4px 6px; margin-left:6px;}
  .quick-del:active{color:var(--red);}
  .match-head-row{display:flex; align-items:flex-start; justify-content:space-between;}
  
  .seg{display:flex; gap:6px; margin-top:6px;}
  .seg-btn{
    flex:1; text-align:center; padding:8px 6px; border-radius:8px; background:var(--surface-2); 
    border:1px solid var(--line); font-size:11px; font-family:'Oswald'; text-transform:uppercase; 
    letter-spacing:0.04em; color:var(--muted); cursor:pointer; transition:all .15s ease;
  }
  .seg-btn.active{background:var(--gold-dim); color:var(--gold); border-color:var(--gold);}
  
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal-card{
    background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:20px; max-width:340px; width:100%;
  }
  .modal-card p{font-size:14px; line-height:1.5; margin:0 0 16px;}
  .goal-list{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .goal-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}
  .goal-row .del{color:var(--muted); background:none; border:none; font-size:16px; cursor:pointer; padding:2px 8px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .stat-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center;}
  .stat-box .num{font-family:'Roboto Mono'; font-size:30px; font-weight:700;}
  .stat-box .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; font-family:'Oswald';}
  .half-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px;}
  .half-bar-row .hlabel{width:52px; color:var(--muted); font-family:'Oswald'; text-transform:uppercase; font-size:11px;}
  .half-bar-track{flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; display:flex;}
  .half-bar-fill.g{background:var(--gold);}
  .half-bar-fill.r{background:var(--red);}
  .scorer-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .scorer-row:last-child{border-bottom:none;}
  .scorer-row .n{font-family:'Roboto Mono'; font-weight:700; color:var(--gold);}

  .player-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .player-item{border-bottom:1px solid var(--line); cursor:pointer;}
  .player-item:last-child{border-bottom:none;}
  .player-item .player-row{border-bottom:none;}
  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1;}
  .add-row button{padding:0 16px; border-radius:8px; border:none; background:var(--gold); color:#241B08; font-weight:700; cursor:pointer;}

  .navbar{
    position:fixed; bottom:0; left:0; right:0; background:#0C1D17; border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:10;
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 4px 8px; background:none; border:none; color:var(--muted);
    font-family:'Oswald'; font-size:9px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .navbtn.active{color:var(--gold);}
  .navbtn svg{width:20px; height:20px;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--gold); color:#241B08; padding:10px 18px; border-radius:20px;
    font-family:'Oswald'; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    font-weight:700; opacity:0; transition:all .25s ease; pointer-events:none; z-index:20; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .section-title{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin:18px 0 8px;}
  .timeline-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .timeline-row:last-child{border-bottom:none;}

  /* HOME */
  .home-screen{position:relative; min-height:calc(100vh - 28px); display:flex; align-items:center; justify-content:center; padding:12px 4px;}
  .home-pitch-bg{position:absolute; inset:-20px 0px; z-index:0; opacity:1;}
  .home-content{position:relative; z-index:1; width:100%; text-align:center;}
  .home-ball{width:64px; height:64px; margin:0 auto 14px;}
  .home-content h1{font-size:26px; margin:0 0 4px; color:var(--chalk); line-height:1.15;}
  .home-content .home-sub{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; font-family:'Oswald'; margin-bottom:34px;}
  .home-menu{display:flex; flex-direction:column; gap:12px;}
  .home-btn{
    display:flex; align-items:center; gap:14px; background:rgba(21,51,40,0.88); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; color:var(--chalk); font-family:'Oswald'; font-size:15px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600; cursor:pointer; text-align:left;
  }
  .home-btn:active{background:var(--gold-dim); border-color:var(--gold);}
  .home-btn-icon{width:22px; height:22px; flex-shrink:0; color:var(--gold);}
  .home-btn-icon svg{width:100%; height:100%;}
  .topbar-home{width:26px; height:26px; margin-right:10px; cursor:pointer; color:var(--gold); flex-shrink:0;}
  .topbar-home svg{width:100%; height:100%;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="navbar" id="navbar" style="display:none;">
  <button class="navbtn" data-tab="jogo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

    Plantel
  </button>

<div class="toast" id="toast"></div>

<script>
let state = { roster: [], matches: [], trainings: [], schedule: [] };
let currentTab = 'home';
let pending = null;
let pendingCard = null;
let expandedMatch = null;
let expandedSchedule = null;
let editingMatchId = null;
let statsFilter = 'todos';
let seasonFilter = 'todas';
let matchSearchQuery = '';
let modalConfig = null;
let expandedPlayer = null;
let trainingForm = null;
let expandedTraining = null;

// New Match Form Temp State
let newMatchType = 'amigavel';
let newMatchLocation = 'casa';
let newMatchCaptain = null;
let schedulingNew = false;

const STORAGE_KEY = 'coach-app-data-v1';
const usingClaudeStorage = (typeof window.storage !== 'undefined');

const storageAdapter = {
  async get(key){
    if(usingClaudeStorage){ try{ return await window.storage.get(key); }catch(e){ return null; } }
    else { const v = localStorage.getItem(key); return v ? { key, value: v } : null; }
  },
  async set(key, value){
    if(usingClaudeStorage) return await window.storage.set(key, value);
    else { localStorage.setItem(key, value); return { key, value }; }
  }
};

async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value) {
       state = JSON.parse(res.value);
       if(!state.trainings) state.trainings = [];
       if(!state.schedule) state.schedule = [];
    }
  }catch(e){}
  render();
}
async function saveState(){
  try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){ showToast('Erro ao guardar ⚠'); }
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2000);
}
function getActiveMatch(){ return state.matches.find(m => !m.finished) || null; }
function playerName(id){
  if(id === 'unknown') return 'Desconhecido';
  const p = state.roster.find(p=>p.id===id); return p ? p.name : '—';
}
function eligiblePlayers(){ return state.roster.filter(p => p.active !== false); }

function defaultSeason(){
  const d = new Date(); const y = d.getFullYear();
  return d.getMonth() >= 6 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function getSeasonsList(){
  const set = new Set(state.matches.map(m => m.season || 'Sem época'));
  return Array.from(set).sort().reverse();
}
function formatMatchTime(ms){
  const totalSecs = Math.floor(ms / 1000);
  const mm = Math.floor(totalSecs / 60); const ss = totalSecs % 60;
  return String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
function getMatchElapsedMs(m){
  if(!m.timer) return 0;
  let total = m.timer.elapsedMs;
  if(m.timer.isRunning) total += (Date.now() - m.timer.lastStartTs);
  return total;
}
function getMatchMinute(m){ return Math.floor(getMatchElapsedMs(m) / 60000); }

/* ---------- MATCH LOGIC ---------- */
function startMatch(opponent, date, type, phase, season, location, captain){
  if(!opponent.trim()) return;
  state.matches.unshift({
    id: uid(), opponent: opponent.trim(), date: date || new Date().toISOString().slice(0,10),
    type: type || 'amigavel', phase: (type==='campeonato' ? (phase||'').trim() : ''),
    season: (season||'').trim() || defaultSeason(),
    location: location || 'casa',
    finished:false, goals: [], cards: [], capitao: captain,
    timer: { isRunning:false, elapsedMs:0, lastStartTs:null }
  });
  newMatchType = 'amigavel'; newMatchLocation = 'casa'; newMatchCaptain = null;
  saveState(); navigateTo('jogo');
}

function startScheduledMatch(schedId){
  const s = state.schedule.find(x => x.id === schedId);
  if(!s) return;
  if(getActiveMatch()) {
    showToast("Já tens um jogo em curso!"); return;
  }
  startMatch(s.opponent, s.date, s.type, s.phase, s.season, s.location, null); // Callup doesn't auto-set captain yet
  state.schedule = state.schedule.filter(x => x.id !== schedId);
  saveState();
}

function scheduleMatch(opponent, date, time, type, phase, season, location){
  if(!opponent.trim()) return;
  state.schedule.push({
    id: uid(), opponent: opponent.trim(), date: date || new Date().toISOString().slice(0,10), time: time || '09:00',
    type: type || 'amigavel', phase: (type==='campeonato' ? (phase||'').trim() : ''),
    season: (season||'').trim() || defaultSeason(), location: location || 'casa',
    callup: []
  });
  state.schedule.sort((a,b) => new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));
  schedulingNew = false;
  saveState(); render(); showToast("Jogo agendado!");
}

function pauseMatchTimer(matchId){
  const m = state.matches.find(m=>m.id===matchId);
  if(!m || !m.timer || !m.timer.isRunning) return;
  m.timer.elapsedMs += (Date.now() - m.timer.lastStartTs);
  m.timer.isRunning = false;
  saveState(); render();
}
function setMatchTimeMark(matchId, key){
  const m = state.matches.find(m=>m.id===matchId);
  if(!m) return;
  if(!m.timeline) m.timeline = {};
  m.timeline[key] = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
  if(!m.timer) m.timer = { isRunning:false, elapsedMs:0, lastStartTs:null };
  if(key === 'kickoff' || key === 'secondHalfStart'){
    m.timer.isRunning = true; m.timer.lastStartTs = Date.now();
  } else if(key === 'halftime' || key === 'fullTime'){
    if(m.timer.isRunning){ m.timer.elapsedMs += (Date.now() - m.timer.lastStartTs); m.timer.isRunning = false; }
  }
  saveState(); render();
}
function currentHalfFromTimeline(m){
  const t = m.timeline;
  if(!t || !t.kickoff) return null;
  const now = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
  if(t.secondHalfStart && now >= t.secondHalfStart) return 2;
  return 1;
}

function finishMatch(id, notes){
  const m = state.matches.find(m=>m.id===id);
  if(m){
    m.finished = true;
    if(notes !== undefined) m.notes = notes;
    if(!m.timeline) m.timeline = {};
    if(!m.timeline.fullTime) m.timeline.fullTime = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
    if(m.timer && m.timer.isRunning) pauseMatchTimer(m.id);
    saveState(); render();
  }
}

function addGoal(matchId, type, half, scorerId, assistId){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  m.goals.push({ id: uid(), type, half, scorerId: type==='scored' ? scorerId : null, assistId: type==='scored' ? (assistId||'none') : null, minute: (m.timer ? getMatchMinute(m) : null) });
  pending = null; saveState(); render();
}
function deleteGoal(matchId, goalId){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  m.goals = m.goals.filter(g=>g.id!==goalId); saveState(); render();
}
function addCard(matchId, playerId, color, half){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  if(!m.cards) m.cards = [];
  m.cards.push({ id: uid(), playerId, color, half, minute: getMatchMinute(m) });
  pendingCard = null; saveState(); render();
}
function deleteCard(matchId, cardId){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  m.cards = m.cards.filter(c=>c.id!==cardId); saveState(); render();
}

function computeStats(typeFilterVal, seasonFilterVal){
  let scored=0, conceded=0;
  let scoredHalf={1:0,2:0}, concededHalf={1:0,2:0};
  let scorerCount = {}, assistCount = {}, yellowCount = {}, redCount = {};
  let wins=0, draws=0, losses=0;
  let casaWins=0, casaDraws=0, casaLosses=0, foraWins=0, foraDraws=0, foraLosses=0;
  
  const matches = state.matches.filter(m => {
    return (!typeFilterVal || typeFilterVal==='todos' || m.type===typeFilterVal) &&
           (!seasonFilterVal || seasonFilterVal==='todas' || (m.season || 'Sem época')===seasonFilterVal);
  });
  matches.forEach(m=>{
    const mScored = m.goals.filter(g=>g.type==='scored').length;
    const mConceded = m.goals.filter(g=>g.type==='conceded').length;
    const loc = m.location || 'casa';
    if(m.finished){
      if(mScored > mConceded){ wins++; loc==='casa'?casaWins++:foraWins++; }
      else if(mScored === mConceded){ draws++; loc==='casa'?casaDraws++:foraDraws++; }
      else { losses++; loc==='casa'?casaLosses++:foraLosses++; }
    }
    m.goals.forEach(g=>{
      if(g.type==='scored'){
        scored++; scoredHalf[g.half]++;
        scorerCount[g.scorerId || 'unknown'] = (scorerCount[g.scorerId || 'unknown']||0)+1;
        if(g.assistId && g.assistId !== 'none' && g.assistId !== 'unknown') assistCount[g.assistId] = (assistCount[g.assistId]||0)+1;
      } else { conceded++; concededHalf[g.half]++; }
    });
    (m.cards||[]).forEach(c=>{
      if(c.color==='Amarelo') yellowCount[c.playerId] = (yellowCount[c.playerId]||0)+1;
      else redCount[c.playerId] = (redCount[c.playerId]||0)+1;
    });
  });
  
  const scorers = Object.entries(scorerCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const assisters = Object.entries(assistCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const cardRanking = [...new Set([...Object.keys(yellowCount), ...Object.keys(redCount)])]
    .map(id=>({id, name: playerName(id), yellow: yellowCount[id]||0, red: redCount[id]||0}))
    .sort((a,b)=>(b.yellow+b.red)-(a.yellow+a.red));
    
  return { scored, conceded, scoredHalf, concededHalf, scorers, assisters, wins, draws, losses, casaWins, casaDraws, casaLosses, foraWins, foraDraws, foraLosses, cardRanking };
}

function attachHandlers(){
  // --- New Match Form Events (DOM ONLY to prevent reset) ---
  document.querySelectorAll('[data-newtype]').forEach(el=>{
    el.onclick = (e)=>{
       e.preventDefault(); document.querySelectorAll('[data-newtype]').forEach(b=>b.classList.remove('active'));
       el.classList.add('active'); newMatchType = el.dataset.newtype;
       const p = document.getElementById('phase-container'); if(p) p.style.display = newMatchType==='campeonato'?'block':'none';
    };
  });
  document.querySelectorAll('[data-loc]').forEach(el=>{
    el.onclick = (e)=>{
       e.preventDefault(); document.querySelectorAll('[data-loc]').forEach(b=>b.classList.remove('active'));
       el.classList.add('active'); newMatchLocation = el.dataset.loc;
    };
  });
  document.querySelectorAll('[data-captain-select]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault(); const id = el.dataset.captainSelect;
      newMatchCaptain = (newMatchCaptain === id ? null : id);
      document.querySelectorAll('[data-captain-select]').forEach(btn => {
         btn.classList.toggle('active-green', btn.dataset.captainSelect === newMatchCaptain);
      });
    };
  });

  const startBtn = document.getElementById('start-match-btn');
  if(startBtn) startBtn.onclick = ()=> startMatch(document.getElementById('opp-input').value, document.getElementById('date-input').value, newMatchType, document.getElementById('phase-input')?.value, document.getElementById('season-input')?.value, newMatchLocation, newMatchCaptain);

  // --- Scheduled Match Events ---
  let tempSchLoc = 'casa'; let tempSchType = 'amigavel';
  document.querySelectorAll('[data-sch-loc]').forEach(el=>{ el.onclick=(e)=>{ document.querySelectorAll('[data-sch-loc]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); tempSchLoc=el.dataset.schLoc; }; });
  document.querySelectorAll('[data-sch-type]').forEach(el=>{ el.onclick=(e)=>{ document.querySelectorAll('[data-sch-type]').forEach(b=>b.classList.remove('active')); el.classList.add('active'); tempSchType=el.dataset.schType; }; });
  
  const saveSch = document.getElementById('btn-save-schedule');
  if(saveSch) saveSch.onclick = ()=> scheduleMatch(document.getElementById('sch-opp').value, document.getElementById('sch-date').value, document.getElementById('sch-time').value, tempSchType, '', '', tempSchLoc);

  document.querySelectorAll('[data-callup-toggle]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const [schId, pId] = el.dataset.callupToggle.split('|');
      const s = state.schedule.find(x=>x.id===schId);
      if(s.callup.includes(pId)) s.callup = s.callup.filter(x=>x!==pId); else s.callup.push(pId);
      saveState(); render();
    };
  });

  document.querySelectorAll('[data-copy-callup]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation(); const s = state.schedule.find(x=>x.id===el.dataset.copyCallup);
      if(!s) return;
      const dateStr = s.date.split('-').reverse().join('/');
      let text = `⚽ *PRÓXIMO JOGO*\n🆚 Adversário: ${s.opponent}\n📅 Data: ${dateStr} às ${s.time}\n🏟️ Local: ${s.location==='casa'?'Em Casa':'Fora'}\n🏆 Competição: ${s.type==='campeonato'?'Oficial':'Amigável'}\n\n📋 *CONVOCADOS:*\n`;
      const called = eligiblePlayers().filter(p => s.callup.includes(p.id));
      if(called.length === 0) text += "- Nenhum selecionado ainda\n";
      called.forEach(p => text += `- ${p.number?`#${p.number} `:''}${p.name}\n`);
      text += "\n⚠️ Ponto de encontro: [Completar]";
      
      navigator.clipboard.writeText(text).then(()=>{ showToast("Copiado para WhatsApp ✓"); }).catch(()=>showToast("Erro ao copiar"));
    };
  });

  // --- In Game Events ---
  const btnScored = document.getElementById('btn-scored');
  if(btnScored) btnScored.onclick = ()=>{ const m = getActiveMatch(); pending = {kind:'scored', half: currentHalfFromTimeline(m)}; render(); };
  const btnConceded = document.getElementById('btn-conceded');
  if(btnConceded) btnConceded.onclick = ()=>{ const m = getActiveMatch(); addGoal(m.id, 'conceded', currentHalfFromTimeline(m)||1, null, null); };

  document.querySelectorAll('[data-half]').forEach(el=>{ el.onclick = ()=>{ pending.half = parseInt(el.dataset.half); render(); }; });
  document.querySelectorAll('[data-scorer]').forEach(el=>{ el.onclick = ()=>{ pending.scorerId = el.dataset.scorer; render(); }; });
  document.querySelectorAll('[data-assist]').forEach(el=>{ el.onclick = ()=>{ addGoal(getActiveMatch().id, 'scored', pending.half, pending.scorerId, el.dataset.assist); }; });
  document.querySelectorAll('[data-card-player]').forEach(el=>{ el.onclick = ()=>{ addCard(getActiveMatch().id, el.dataset.cardPlayer, pendingCard.color, currentHalfFromTimeline(getActiveMatch())||1); }; });

  // Safety Deletes
  document.querySelectorAll('[data-del-goal]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); askConfirm('Eliminar este golo?', ()=>deleteGoal(getActiveMatch().id, el.dataset.delGoal)); };
  });
  document.querySelectorAll('[data-del-card]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); askConfirm('Eliminar este cartão?', ()=>deleteCard(getActiveMatch().id, el.dataset.delCard)); };
  });

  document.querySelectorAll('[data-time-mark]').forEach(el=>{
    el.onclick = ()=>{
      const [matchId, key] = el.dataset.timeMark.split('|');
      askConfirm('Registar este momento do jogo?', ()=>setMatchTimeMark(matchId, key));
    };
  });

  const modalConfirmBtn = document.getElementById('modal-confirm-btn');
  if(modalConfirmBtn) modalConfirmBtn.onclick = ()=>{
    const cb = modalConfig.onConfirm; modalConfig = null; if(cb) cb();
  };

  const finishBtn = document.getElementById('finish-match-btn');
  if(finishBtn) finishBtn.onclick = ()=>{
    const m = getActiveMatch(); const notes = document.getElementById('notes-input')?.value;
    if(m){
      if(!m.timeline || !m.timeline.kickoff) askConfirm('Ainda não iniciaste a cronologia deste jogo. Queres mesmo terminar?', () => finishMatch(m.id, notes));
      else finishMatch(m.id, notes);
    }
  };
}

setInterval(()=>{
  if(currentTab !== 'jogo') return;
  const m = getActiveMatch(); if(!m || !m.timer || !m.timer.isRunning) return;
  const el = document.getElementById('live-timer'); if(el) el.textContent = formatMatchTime(getMatchElapsedMs(m));
}, 1000);

loadState();
</script>
</body>
</html>
