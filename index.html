<title>Registo de Jogos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#0E211A; --surface:#153328; --surface-2:#1C4133;
    --chalk:#F3EFE6; --muted:#8FA79B;
    --gold:#D9A441; --gold-dim:#4A3E22;
    --red:#C8493F; --red-dim:#3F2320;
    --yellow:#E1C324; --green:#4ade80; --green-dim:#133320;
    --line:rgba(243,239,230,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{min-height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter',sans-serif;
    padding-bottom:76px; padding-top:env(safe-area-inset-top); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
  .mono{font-family:'Roboto Mono',monospace;}
  .app{max-width:520px; margin:0 auto; padding:24px 16px 8px;}
  
  svg { pointer-events: none; flex-shrink: 0; }

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .topbar h1{font-size:20px; margin:0; color:var(--chalk); font-weight:600;}
  .topbar-home{width:26px; height:26px; margin-right:10px; cursor:pointer; color:var(--gold); display:flex; align-items:center; justify-content:center;}
  
  .scoreboard{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 16px; margin-bottom:16px; }
  .scoreboard .opponent{font-size:13px; color:var(--muted); font-family:'Inter'; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .score-row{display:flex; align-items:center; justify-content:center; gap:18px;}
  .score-block{text-align:center; flex:1;}
  .score-num{font-family:'Roboto Mono',monospace; font-size:44px; font-weight:700; line-height:1;}
  .score-block.scored .score-num{color:var(--gold);}
  .score-block.conceded .score-num{color:var(--red);}
  .score-label{font-size:10px; letter-spacing:0.12em; color:var(--muted); margin-top:6px; font-family:'Oswald'; text-transform:uppercase;}
  .score-sep{font-size:24px; color:var(--muted); font-family:'Roboto Mono';}

  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; border:none; border-radius:10px; padding:14px 10px; font-family:'Oswald'; font-size:14px;
    letter-spacing:0.03em; text-transform:uppercase; font-weight:600; cursor:pointer; transition:transform .08s ease; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-gold{background:var(--gold); color:#241B08;}
  .btn-red{background:var(--red); color:#2B0F0C;}
  .btn-green{background:var(--green); color:#0E211A;}
  .btn-ghost{background:var(--surface-2); color:var(--chalk);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--muted);}
  .btn:disabled{opacity:0.4;}

  .card-mini-btn{ background:transparent; border-radius:20px; padding:6px 14px; font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; cursor:pointer; }
  .card-mini-btn.yellow{border:1px solid var(--yellow); color:var(--yellow);}
  .card-mini-btn.red{border:1px solid var(--red); color:var(--red);}
  .card-mini-btn:disabled{opacity:0.35;}
  
  .chrono-card{text-align:center; margin-bottom:16px;}
  .chrono-time{font-size:36px; font-weight:700; font-family:'Roboto Mono',monospace; color:var(--chalk); letter-spacing:0.02em;}
  .chrono-sub{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin-bottom:8px;}

  .panel{ background:var(--surface-2); border-radius:12px; padding:14px; margin-top:12px; border:1px solid var(--line); }
  .panel-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin-bottom:10px;}
  .grid-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .grid-btns.cols-4{grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;}
  .chip{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 8px; text-align:center; font-size:13px; font-weight:600; cursor:pointer; color:var(--chalk); transition:all .15s ease; }
  .chip:active{background:var(--gold-dim);}
  .chip.chip-sm{padding:9px 4px; font-size:11px; line-height:1.3; word-break:break-word;}
  .chip.absent{background:var(--red-dim); border-color:var(--red); color:var(--red);}
  .chip.active-green { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'Oswald'; margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px; color:var(--chalk); font-family:'Inter'; font-size:15px;
  }
  .field input[type="date"], .field input[type="time"]{ -webkit-appearance:none; appearance:none; text-align:left; }
  .field input:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:80px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .match-head{display:flex; justify-content:space-between; align-items:center;}
  .match-head .opp{font-weight:600; font-size:15px;}
  .match-head .date{font-size:11px; color:var(--muted); margin-top:3px;}
  .match-score{font-family:'Roboto Mono'; font-weight:700; font-size:16px;}
  .match-score .s{color:var(--gold);} .match-score .c{color:var(--red);}
  
  .badge-type, .badge-loc{ display:inline-block; font-size:9px; padding:2px 6px; border-radius:4px; margin-left:6px; text-transform:uppercase; font-family:'Oswald'; letter-spacing:0.05em; }
  .badge-type{background:var(--surface-2); color:var(--muted);}
  .badge-loc.casa{border:1px solid var(--green); color:var(--green);}
  .badge-loc.fora{border:1px solid var(--red); color:var(--red);}
  .badge-open{display:inline-block; font-size:9px; background:var(--gold-dim); color:var(--gold); padding:2px 6px; border-radius:4px; margin-left:6px; text-transform:uppercase; font-family:'Oswald'; letter-spacing:0.05em;}

  .quick-del{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:4px 6px; margin-left:6px;}
  .quick-del:active{color:var(--red);}
  .match-head-row{display:flex; align-items:flex-start; justify-content:space-between;}
  
  .seg{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .seg-btn{ flex:1; text-align:center; padding:8px 6px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-size:11px; font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); cursor:pointer; transition:all 0.15s ease;}
  .seg-btn.active{background:var(--gold-dim); color:var(--gold); border-color:var(--gold);}
  
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:9999; }
  .modal-card{ background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:20px; max-width:340px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  .modal-card p{font-size:14px; line-height:1.5; margin:0 0 20px;}
  .goal-list{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .goal-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}
  .goal-row .del{color:var(--muted); background:none; border:none; font-size:16px; cursor:pointer; padding:2px 8px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .stat-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center;}
  .stat-box .num{font-family:'Roboto Mono'; font-size:30px; font-weight:700;}
  .stat-box .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; font-family:'Oswald';}
  .scorer-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .scorer-row:last-child{border-bottom:none;}
  .scorer-row .n{font-family:'Roboto Mono'; font-weight:700; color:var(--gold);}

  .player-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .player-item{border-bottom:1px solid var(--line); cursor:pointer;}
  .player-item:last-child{border-bottom:none;}
  .player-item .player-row{border-bottom:none;}
  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1;}
  .add-row button{padding:0 16px; border-radius:8px; border:none; background:var(--gold); color:#241B08; font-weight:700; cursor:pointer;}
  .notes-readonly{font-size:13px; color:var(--muted); white-space:pre-wrap; line-height:1.5; padding-top:4px;}

  .navbar{ position:fixed; bottom:0; left:0; right:0; background:#0C1D17; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:10; }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px 4px 8px; background:none; border:none; color:var(--muted); font-family:'Oswald'; font-size:9px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; }
  .navbtn.active{color:var(--gold);}
  
  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gold); color:#241B08; padding:10px 18px; border-radius:20px; font-family:'Oswald'; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; opacity:0; transition:all .25s ease; pointer-events:none; z-index:9999; white-space:nowrap; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .section-title{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-family:'Oswald'; margin:18px 0 8px;}

  /* HOME */
  .home-screen{position:relative; min-height:calc(100vh - 28px); display:flex; align-items:center; justify-content:center; padding:12px 4px;}
  .home-pitch-bg{position:absolute; inset:-20px 0px; z-index:0; opacity:1;}
  .home-content{position:relative; z-index:1; width:100%; text-align:center;}
  .home-ball{width:64px; height:64px; margin:0 auto 14px; display:flex; justify-content:center;}
  .home-content h1{font-size:26px; margin:0 0 4px; color:var(--chalk); line-height:1.15;}
  .home-content .home-sub{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; font-family:'Oswald'; margin-bottom:34px;}
  .home-menu{display:flex; flex-direction:column; gap:12px;}
  .home-btn{ display:flex; align-items:center; gap:14px; background:rgba(21,51,40,0.88); border:1px solid var(--line); border-radius:14px; padding:16px 18px; color:var(--chalk); font-family:'Oswald'; font-size:15px; text-transform:uppercase; letter-spacing:0.04em; font-weight:600; cursor:pointer; text-align:left; }
  .home-btn:active{background:var(--gold-dim); border-color:var(--gold);}
  .home-btn-icon{width:24px; height:24px; flex-shrink:0; color:var(--gold); display:flex; justify-content:center; align-items:center;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<script>
let state = { roster: [], matches: [], trainings: [], schedule: [] };
let currentTab = 'home';
let pending = null;
let pendingCard = null;
let pendingCaptain = false;
let expandedMatch = null;
let expandedSchedule = null;
let statsFilter = 'todos';
let seasonFilter = 'todas';
let matchSearchQuery = '';
let modalConfig = null;
let expandedPlayer = null;
let trainingForm = null;
let expandedTraining = null;

let schedulingNew = false;
let schForm = { opp: '', date: '', time: '09:00', type: 'amigavel', loc: 'casa' };

const STORAGE_KEY = 'coach-app-data-v1';
const usingClaudeStorage = (typeof window.storage !== 'undefined');
const storageAdapter = {
  async get(key){
    if(usingClaudeStorage){ try{ return await window.storage.get(key); }catch(e){ return null; } }
    else { const v = localStorage.getItem(key); return v ? { key, value: v } : null; }
  },
  async set(key, value){
    if(usingClaudeStorage) return await window.storage.set(key, value);
    else { localStorage.setItem(key, value); return { key, value }; }
  }
};

async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value) {
       state = JSON.parse(res.value);
       if(!state.trainings) state.trainings = [];
       if(!state.schedule) state.schedule = [];
    }
  }catch(e){}
  render();
}
async function saveState(){ try{ await storageAdapter.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function uid(){ return Math.random().toString(36).slice(2,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

window.navigateTo = function(tab){ currentTab = tab; pending = null; pendingCard = null; pendingCaptain = false; render(); };
window.goHome = function(){ currentTab = 'home'; pending = null; pendingCard = null; pendingCaptain = false; render(); };

function getActiveMatch(){ return state.matches.find(m => !m.finished) || null; }
function playerName(id){
  if(id === 'unknown') return 'Desconhecido';
  const p = state.roster.find(p=>p.id===id); return p ? p.name : '—';
}
function eligiblePlayers(){ return state.roster.filter(p => p.active !== false); }
function computeAge(birthDateStr){
  const b = new Date(birthDateStr); if(isNaN(b)) return null;
  const t = new Date(); let age = t.getFullYear() - b.getFullYear();
  const mDiff = t.getMonth() - b.getMonth();
  if(mDiff < 0 || (mDiff === 0 && t.getDate() < b.getDate())) age--;
  return age;
}
function defaultSeason(){
  const d = new Date(); const y = d.getFullYear();
  return d.getMonth() >= 6 ? `${y}/${y+1}` : `${y-1}/${y}`;
}
function getSeasonsList(){
  const set = new Set(state.matches.map(m => m.season || 'Sem época'));
  return Array.from(set).sort().reverse();
}
function formatMatchTime(ms){
  const totalSecs = Math.floor(ms / 1000);
  const mm = Math.floor(totalSecs / 60); const ss = totalSecs % 60;
  return String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
function getMatchElapsedMs(m){
  if(!m.timer) return 0;
  let total = m.timer.elapsedMs;
  if(m.timer.isRunning) total += (Date.now() - m.timer.lastStartTs);
  return total;
}
function getMatchMinute(m){ return Math.floor(getMatchElapsedMs(m) / 60000); }

/* ---------- MATCH LOGIC ---------- */
window.uiSaveSchedule = function(){
  if(!schForm.opp.trim()){ showToast("Insere um adversário!"); return; }
  state.schedule.push({
    id: uid(), opponent: schForm.opp.trim(), date: schForm.date || new Date().toISOString().slice(0,10), time: schForm.time || '09:00',
    type: schForm.type || 'amigavel', phase: '', season: defaultSeason(), location: schForm.loc || 'casa', callup: []
  });
  state.schedule.sort((a,b) => new Date(a.date+'T'+a.time) - new Date(b.date+'T'+b.time));
  schedulingNew = false;
  saveState(); render(); showToast("Jogo agendado!");
};

window.startScheduledMatch = function(schedId){
  const s = state.schedule.find(x => x.id === schedId);
  if(!s) return;
  if(getActiveMatch()) { showToast("Já tens um jogo em curso!"); return; }
  state.matches.unshift({
    id: uid(), opponent: s.opponent, date: s.date, type: s.type, phase: s.phase || '', season: s.season || defaultSeason(), location: s.location,
    finished:false, goals: [], cards: [], capitao: null, timer: { isRunning:false, elapsedMs:0, lastStartTs:null }
  });
  state.schedule = state.schedule.filter(x => x.id !== schedId);
  saveState(); navigateTo('jogo');
};

window.pauseMatchTimer = function(matchId){
  const m = state.matches.find(m=>m.id===matchId);
  if(!m || !m.timer || !m.timer.isRunning) return;
  m.timer.elapsedMs += (Date.now() - m.timer.lastStartTs); m.timer.isRunning = false;
  saveState(); render();
};

window.setMatchTimeMark = function(matchId, key){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  if(!m.timeline) m.timeline = {};
  m.timeline[key] = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
  if(!m.timer) m.timer = { isRunning:false, elapsedMs:0, lastStartTs:null };
  if(key === 'kickoff' || key === 'secondHalfStart'){
    m.timer.isRunning = true; m.timer.lastStartTs = Date.now();
  } else if(key === 'halftime' || key === 'fullTime'){
    if(m.timer.isRunning){ m.timer.elapsedMs += (Date.now() - m.timer.lastStartTs); m.timer.isRunning = false; }
  }
  saveState(); render();
};

window.currentHalfFromTimeline = function(m){
  const t = m.timeline; if(!t || !t.kickoff) return null;
  const now = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
  if(t && t.secondHalfStart && now >= t.secondHalfStart) return 2;
  return 1;
};

window.uiFinishMatch = function(){
  const m = getActiveMatch(); const notes = (document.getElementById('notes-input') || {}).value;
  if(!m) return;
  const finalize = () => {
    m.finished = true;
    if(notes !== undefined) m.notes = notes;
    if(!m.timeline) m.timeline = {};
    if(!m.timeline.fullTime) m.timeline.fullTime = String(new Date().getHours()).padStart(2,'0') + ':' + String(new Date().getMinutes()).padStart(2,'0');
    if(m.timer && m.timer.isRunning) window.pauseMatchTimer(m.id);
    saveState(); render();
  };
  if(m.timeline && m.timeline.kickoff) finalize();
  else window.askConfirm('Ainda não iniciaste a cronologia deste jogo. Queres mesmo terminar?', finalize);
};

window.reopenMatch = function(id){ const m = state.matches.find(m=>m.id===id); if(m){ m.finished=false; saveState(); render(); } };
window.deleteMatch = function(id){ state.matches = state.matches.filter(m=>m.id!==id); saveState(); render(); };
window.deleteSchedule = function(id){ state.schedule = state.schedule.filter(x=>x.id!==id); saveState(); render(); };

window.addGoal = function(matchId, type, half, scorerId, assistId){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  m.goals.push({ id: uid(), type, half, scorerId: type==='scored' ? scorerId : null, assistId: type==='scored' ? (assistId||'none') : null, minute: (m.timer ? getMatchMinute(m) : null) });
  pending = null; saveState(); render();
};
window.deleteGoal = function(matchId, goalId){ const m = state.matches.find(m=>m.id===matchId); if(!m) return; m.goals = m.goals.filter(g=>g.id!==goalId); saveState(); render(); };

window.addCard = function(matchId, playerId, color, half){
  const m = state.matches.find(m=>m.id===matchId); if(!m) return;
  if(!m.cards) m.cards = []; m.cards.push({ id: uid(), playerId, color, half, minute: getMatchMinute(m) });
  pendingCard = null; saveState(); render();
};
window.deleteCard = function(matchId, cardId){ const m = state.matches.find(m=>m.id===matchId); if(!m) return; m.cards = m.cards.filter(c=>c.id!==cardId); saveState(); render(); };

window.setCaptain = function(matchId, playerId){
  const m = state.matches.find(m=>m.id===matchId); if(m){ m.capitao = playerId; saveState(); }
  pendingCaptain = false; render();
};

/* ---------- MODAL ---------- */
window.askConfirm = function(message, onConfirm){
  modalConfig = { message, onConfirm };
  document.getElementById('modal-root').innerHTML = renderModalHTML();
};
window.closeModal = function(){ modalConfig = null; document.getElementById('modal-root').innerHTML = ''; };
window.confirmModal = function(){ const cb = modalConfig ? modalConfig.onConfirm : null; window.closeModal(); if(cb) cb(); };

function renderModalHTML(){
  if(!modalConfig) return '';
  return `
    <div class="modal-overlay">
      <div class="modal-card">
        <p>${modalConfig.message}</p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-red" onclick="confirmModal()">Confirmar</button>

}

function topbarHtml(title){ return `<div class="topbar"><span class="topbar-home" onclick="goHome()" title="Início">${ballIconSvg()}</span><h1>${title}</h1></div>`; }
function ballIconSvg(){
  return `<svg style="width:100%; height:100%;" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="var(--gold)" stroke-width="4"/>
    <polygon points="50,29 63,39 58,55 42,55 37,39" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50 29 L50 9 M63 39 L81 30 M58 55 L71 71 M42 55 L29 71 M37 39 L19 30" stroke="var(--gold)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function matchNarrativeHtml(m){
  const t = m.timeline || {}; const cards = m.cards || [];
  const eventsForHalf = (half) => {
    const goals = m.goals.filter(g=>g.half===half).map(g=>({ type:'goal', minute:g.minute, data:g }));
    const cds = cards.filter(c=>c.half===half).map(c=>({ type:'card', minute:c.minute, data:c }));
    return [...goals, ...cds].sort((a,b)=>(a.minute==null?999:a.minute)-(b.minute==null?999:b.minute));
  };
  const goalRow = (g) => `<div class="goal-row"><span>${g.minute!=null?`<span class="mono" style="color:var(--gold);">${g.minute}'</span> `:''}${g.type==='scored'?'⚽ '+playerName(g.scorerId)+(g.assistId&&g.assistId!=='none'?' (ast. '+playerName(g.assistId)+')':''):'🥅 Sofrido'}</span><button class="del" onclick="event.stopPropagation(); askConfirm('Eliminar golo?', ()=>deleteGoal('${m.id}', '${g.id}'))">✕</button></div>`;
  const cardRow = (c) => `<div class="goal-row"><span>${c.minute!=null?`<span class="mono" style="color:var(--gold);">${c.minute}'</span> `:''}${c.color==='Amarelo'?'🟨':'🟥'} ${playerName(c.playerId)}</span><button class="del" onclick="event.stopPropagation(); askConfirm('Eliminar cartão?', ()=>deleteCard('${m.id}', '${c.id}'))">✕</button></div>`;
  const markRow = (label, time) => `<div class="goal-row" style="opacity:0.8;"><span><b>${label}</b></span><span class="mono" style="color:var(--gold);">${time}</span></div>`;

  let rows = '';
  if(t.kickoff) rows += markRow('Início', t.kickoff);
  rows += eventsForHalf(1).map(e => e.type==='goal'?goalRow(e.data):cardRow(e.data)).join('');
  if(t.halftime) rows += markRow('Intervalo', t.halftime);
  if(t.secondHalfStart) rows += markRow('Início 2ªP', t.secondHalfStart);
  rows += eventsForHalf(2).map(e => e.type==='goal'?goalRow(e.data):cardRow(e.data)).join('');
  if(t.fullTime) rows += markRow('Fim', t.fullTime);

  return rows || '<div class="empty">Sem cronologia, golos ou cartões.</div>';
}

function renderJogo(){
  const m = getActiveMatch();
  if(!m){
    return `

        <button class="btn btn-gold" style="width:100%; max-width:300px; margin:20px auto 0;" onclick="navigateTo('calendario')">Ir para Calendário</button>
      </div>
    `;
  }

  const scored = m.goals.filter(g=>g.type==='scored').length;
  const conceded = m.goals.filter(g=>g.type==='conceded').length;
  const matchStarted = m.timeline && m.timeline.kickoff;
  const locLabel = (m.location||'casa') === 'casa' ? 'Casa' : 'Fora';

  let dynamicPanel = '';
  if(pendingCaptain){
    let captainChips = eligiblePlayers().length ? eligiblePlayers().map(p=>`<div class="chip chip-sm ${m.capitao===p.id?'active-green':''}" onclick="setCaptain('${m.id}','${p.id}')">${p.name}</div>`).join('') : '<div class="empty" style="grid-column:1/-1;">Sem jogadores.</div>';

  } else if(pending && !pending.half){

      </div>`;

    dynamicPanel = `
      <div class="panel">
        <div class="panel-title">Cartão ${pendingCard.color} — quem?</div>

        <button class="btn btn-outline" style="width:100%; margin-top:10px;" onclick="pendingCard=null; render()">Cancelar</button>

      ${(m.timeline && m.timeline.kickoff && !m.timeline.halftime) ? `<button class="btn btn-ghost" style="padding:8px; font-size:11px; margin-top:10px;" onclick="askConfirm('Registar intervalo?', ()=>setMatchTimeMark('${m.id}','halftime'))">Intervalo</button>` : ''}
      ${(m.timeline && m.timeline.halftime && !m.timeline.secondHalfStart) ? `<button class="btn btn-gold" style="padding:8px; font-size:11px; margin-top:10px;" onclick="askConfirm('Registar início da 2ª parte?', ()=>setMatchTimeMark('${m.id}','secondHalfStart'))">Início 2ª Parte</button>` : ''}

        <div style="font-size:15px;">vs <span style="font-weight:600; color:white;">${m.opponent}</span> <span class="badge-loc ${locLabel.toLowerCase()}">${locLabel}</span></div>
        <span>${m.date}</span>
      </div>
      ${m.capitao ? 
        `<div style="font-size:11px; color:var(--muted); font-family:'Oswald'; margin-bottom:12px; text-transform:uppercase; display:flex; align-items:center; gap:8px;">
          <span>© Capitão: <span style="color:var(--green);">${playerName(m.capitao)}</span></span>

      </div>
      <div class="btn-row">
        <button class="btn btn-gold" onclick="pending={kind:'scored', half: window.currentHalfFromTimeline(getActiveMatch())}; render();" ${(!matchStarted||pending||pendingCard||pendingCaptain)?'disabled':''}>+ Marcado</button>
        <button class="btn btn-red" onclick="addGoal('${m.id}', 'conceded', window.currentHalfFromTimeline(getActiveMatch())||1, null, null)" ${(!matchStarted||pending||pendingCard||pendingCaptain)?'disabled':''}>+ Sofrido</button>
      </div>
      ${matchStarted ? `
        <div style="display:flex; gap:8px; justify-content:center; margin-top:10px;">
          <button class="card-mini-btn yellow" onclick="pendingCard={color:'Amarelo'}; render()" ${(pending||pendingCard||pendingCaptain)?'disabled':''}>🟨 Amarelo</button>
          <button class="card-mini-btn red" onclick="pendingCard={color:'Vermelho'}; render()" ${(pending||pendingCard||pendingCaptain)?'disabled':''}>🟥 Vermelho</button>
        </div>
      ` : ''}
      ${dynamicPanel}
    </div>
    
    ${m.goals.length ? `<div class="goal-list">${m.goals.map(g=>`<div class="goal-row"><span>${g.minute!=null?`<span class="mono" style="color:var(--gold);">${g.minute}'</span> `:''}${g.type==='scored' ? '⚽ '+playerName(g.scorerId)+(g.assistId&&g.assistId!=='none'?' (ast. '+playerName(g.assistId)+')':'') : '🥅 Sofrido'} <span style="color:var(--muted)">- ${g.half}ªP</span></span> <button class="del" onclick="askConfirm('Eliminar golo?', ()=>deleteGoal('${m.id}', '${g.id}'))">✕</button></div>`).join('')}</div>` : ''}
    ${m.cards && m.cards.length ? `<div class="goal-list">${m.cards.map(c=>`<div class="goal-row"><span>${c.minute!=null?`<span class="mono" style="color:var(--gold);">${c.minute}'</span> `:''}${c.color==='Amarelo'?'🟨':'🟥'} ${playerName(c.playerId)}</span> <button class="del" onclick="askConfirm('Eliminar cartão?', ()=>deleteCard('${m.id}', '${c.id}'))">✕</button></div>`).join('')}</div>` : ''}
    
    <div class="card" style="margin-top:16px;">
      <div class="field" style="margin-bottom:0;">
        <label>Notas finais do jogo</label>
        <textarea id="notes-input" placeholder="Ex: equipa cansada na 2ª parte...">${m.notes || ''}</textarea>
      </div>
    </div>
    <button class="btn btn-ghost" style="width:100%; margin-top:6px;" onclick="uiFinishMatch()">Terminar Jogo</button>
  `;
}

window.toggleCallup = function(schId, pId){
  const s = state.schedule.find(x=>x.id===schId);
  if(s){ if(s.callup.includes(pId)) s.callup = s.callup.filter(x=>x!==pId); else s.callup.push(pId); saveState(); render(); }
};
window.copyCallup = function(schId){
  const s = state.schedule.find(x=>x.id===schId); if(!s) return;
  const dateStr = s.date.split('-').reverse().join('/');
  let text = `⚽ *PRÓXIMO JOGO*\n🆚 Adversário: ${s.opponent}\n📅 Data: ${dateStr} às ${s.time}\n🏟️ Local: ${s.location==='casa'?'Em Casa':'Fora'}\n🏆 Campeonato: ${s.type==='campeonato'?'Oficial':'Amigável'}\n\n📋 *CONVOCADOS:*\n`;
  const called = eligiblePlayers().filter(p => s.callup.includes(p.id));
  if(called.length === 0) text += "- Nenhum selecionado ainda\n";
  called.forEach(p => text += `- ${p.number?`#${p.number} `:''}${p.name}\n`);
  text += "\n⚠️ Ponto de encontro: [Completar]";
  navigator.clipboard.writeText(text).then(()=>showToast("Copiado para WhatsApp ✓")).catch(()=>showToast("Erro ao copiar"));
};

window.uiSaveTraining = function(){
  const date = (document.getElementById('tr-date-input') || {}).value || '';
  const notes = (document.getElementById('tr-notes-input') || {}).value || '';
  state.trainings.unshift({ id: uid(), date, notes, absences: [...trainingForm.absences] });
  trainingForm = null; saveState(); render(); showToast('Treino guardado ✓');
};
window.toggleTrAbsence = function(id){
  if(trainingForm.absences.includes(id)) trainingForm.absences = trainingForm.absences.filter(x=>x!==id);
  else trainingForm.absences.push(id);
  render();
};
window.deleteTraining = function(id){ state.trainings = state.trainings.filter(t=>t.id!==id); saveState(); render(); };

function renderTreinos(){
  if(trainingForm){
    const players = eligiblePlayers();
    return `
      ${topbarHtml('Novo Treino')}
      <div class="card">
        <div class="field"><label>Data</label><input id="tr-date-input" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field" style="margin-bottom:0;"><label>Notas / Foco</label><textarea id="tr-notes-input" placeholder="Ex: trabalho de finalização..."></textarea></div>
      </div>
      <div class="card">
        <div class="panel-title" style="margin-bottom:6px;">Faltas</div>
        <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">Todos ficam presentes por omissão. Toca em quem faltou.</div>
        ${players.length ? `<div class="grid-btns cols-4">${players.map(p=>`<div class="chip chip-sm ${trainingForm.absences.includes(p.id)?'absent':''}" onclick="toggleTrAbsence('${p.id}')">${p.name}</div>`).join('')}</div>` : '<div class="empty">Sem jogadores.</div>'}
      </div>
      <button class="btn btn-gold" style="width:100%; margin-bottom:10px;" onclick="uiSaveTraining()">Guardar Treino</button>
      <button class="btn btn-outline" style="width:100%;" onclick="trainingForm=null; render()">Cancelar</button>
    `;
  }

  return `
    ${topbarHtml('Treinos')}
    <button class="btn btn-gold" style="width:100%; margin-bottom:14px;" onclick="trainingForm={absences:[]}; render()">+ Novo Treino</button>
    ${state.trainings.length ? state.trainings.map(t=>{
      const open = expandedTraining === t.id;
      const absentNames = (t.absences||[]).map(playerName);
      const presentCount = eligiblePlayers().length - absentNames.length;
      return `
        <div class="card match-item" onclick="if(!event.target.closest('button')){ expandedTraining=expandedTraining==='${t.id}'?null:'${t.id}'; render(); }">
          <div class="match-head-row">
            <div class="match-head" style="flex:1;">
              <div>
                <div class="opp">${t.date}</div>
                <div class="date">${presentCount} presentes${absentNames.length ? ` · ${absentNames.length} faltas` : ''}</div>
              </div>
            </div>
            <button class="quick-del" onclick="event.stopPropagation(); askConfirm('Apagar treino?', ()=>deleteTraining('${t.id}'))">🗑</button>
          </div>
          ${open ? `
            <div class="goal-list">
              ${t.notes ? `<div class="notes-readonly">📝 ${t.notes}</div>` : ''}
              <div style="font-size:12px; margin-top:8px; color:var(--muted);"><b style="color:var(--chalk);">Faltas:</b> ${absentNames.length ? absentNames.join(', ') : 'Ninguém'}</div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('') : '<div class="empty">Ainda não há treinos registados.</div>'}
  `;
}

function renderJogos(){
  if(!state.matches.length) return `${topbarHtml('Resultados')}<div class="empty">Ainda não há jogos registados.</div>`;
  const seasons = getSeasonsList();
  const query = matchSearchQuery.trim().toLowerCase();
  const filtered = state.matches.filter(m=>{
    const seasonOk = seasonFilter==='todas' || (m.season || 'Sem época')===seasonFilter;
    const searchOk = !query || m.opponent.toLowerCase().includes(query);
    return seasonOk && searchOk;
  });

  return `
    ${topbarHtml('Resultados')}
    <div class="field"><input id="match-search-input" type="text" placeholder="Pesquisar por adversário..." value="${matchSearchQuery}" oninput="uiUpdateSearch(this.value)"></div>
    ${seasons.length > 1 ? `<div class="seg" style="margin-bottom:14px;">
      <div class="seg-btn ${seasonFilter==='todas'?'active':''}" onclick="seasonFilter='todas'; render()">Todas</div>
      ${seasons.map(s=>`<div class="seg-btn ${seasonFilter===s?'active':''}" onclick="seasonFilter='${s}'; render()">${s}</div>`).join('')}
    </div>` : ''}
    
    ${filtered.length ? filtered.map(m=>{
      const scored = m.goals.filter(g=>g.type==='scored').length;
      const conceded = m.goals.filter(g=>g.type==='conceded').length;
      const open = expandedMatch === m.id;
      const typeLabel = m.type === 'campeonato' ? `Campeonato${m.phase ? ' · '+m.phase : ''}` : 'Amigável';
      const locLabel = (m.location||'casa') === 'casa' ? 'Casa' : 'Fora';
      return `
        <div class="card match-item" onclick="if(!event.target.closest('button')){ expandedMatch=expandedMatch==='${m.id}'?null:'${m.id}'; render(); }">
          <div class="match-head-row">
            <div class="match-head" style="flex:1;">
              <div>
                <div class="opp">${m.opponent} ${!m.finished ? '<span class="badge-open">Em curso</span>' : ''}<span class="badge-loc ${locLabel.toLowerCase()}">${locLabel}</span></div>
                <div class="date">${m.date} <span class="badge-type">${typeLabel}</span></div>
              </div>
              <div class="match-score"><span class="s">${scored}</span> – <span class="c">${conceded}</span></div>
            </div>
            <button class="quick-del" onclick="event.stopPropagation(); askConfirm('Eliminar jogo?', ()=>deleteMatch('${m.id}'))">🗑</button>
          </div>
          ${open ? `
            <div class="goal-list">
              ${m.capitao ? `<div style="font-size:11px; color:var(--green); font-family:'Oswald'; margin-bottom:8px; text-transform:uppercase;">© Capitão: ${playerName(m.capitao)}</div>` : ''}
              ${matchNarrativeHtml(m)}
              ${m.notes ? `<div class="notes-readonly">📝 ${m.notes}</div>` : ''}
              <div class="btn-row" style="margin-top:12px;">
                ${m.finished ? `<button class="btn btn-outline" onclick="event.stopPropagation(); reopenMatch('${m.id}')">Reabrir Jogo</button>` : ''}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('') : '<div class="empty">Nenhum jogo corresponde à pesquisa.</div>'}
  `;
}

function computeStats(typeFilterVal, seasonFilterVal){
  let scored=0, conceded=0; let scoredHalf={1:0,2:0}, concededHalf={1:0,2:0};
  let scorerCount = {}, assistCount = {}, yellowCount = {}, redCount = {};
  let wins=0, draws=0, losses=0; let casaWins=0, casaDraws=0, casaLosses=0, foraWins=0, foraDraws=0, foraLosses=0;
  const matches = state.matches.filter(m => (!typeFilterVal || typeFilterVal==='todos' || m.type===typeFilterVal) && (!seasonFilterVal || seasonFilterVal==='todas' || (m.season || 'Sem época')===seasonFilterVal));
  matches.forEach(m=>{
    const mScored = m.goals.filter(g=>g.type==='scored').length;
    const mConceded = m.goals.filter(g=>g.type==='conceded').length;
    const loc = m.location || 'casa';
    if(m.finished){
      if(mScored > mConceded){ wins++; loc==='casa'?casaWins++:foraWins++; }
      else if(mScored === mConceded){ draws++; loc==='casa'?casaDraws++:foraDraws++; }
      else { losses++; loc==='casa'?casaLosses++:foraLosses++; }
    }
    m.goals.forEach(g=>{
      if(g.type==='scored'){
        scored++; scoredHalf[g.half]++; scorerCount[g.scorerId || 'unknown'] = (scorerCount[g.scorerId || 'unknown']||0)+1;
        if(g.assistId && g.assistId !== 'none' && g.assistId !== 'unknown') assistCount[g.assistId] = (assistCount[g.assistId]||0)+1;
      } else { conceded++; concededHalf[g.half]++; }
    });
    (m.cards||[]).forEach(c=>{ if(c.color==='Amarelo') yellowCount[c.playerId] = (yellowCount[c.playerId]||0)+1; else redCount[c.playerId] = (redCount[c.playerId]||0)+1; });
  });
  const scorers = Object.entries(scorerCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const assisters = Object.entries(assistCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const cardRanking = [...new Set([...Object.keys(yellowCount), ...Object.keys(redCount)])].map(id=>({id, name: playerName(id), yellow: yellowCount[id]||0, red: redCount[id]||0})).sort((a,b)=>(b.yellow+b.red)-(a.yellow+a.red));
  return { scored, conceded, scoredHalf, concededHalf, scorers, assisters, wins, draws, losses, casaWins, casaDraws, casaLosses, foraWins, foraDraws, foraLosses, cardRanking };
}

function renderStats(){
  const s = computeStats(statsFilter, seasonFilter);
  return `
    ${topbarHtml('Estatísticas')}
    <div class="seg">
      <div class="seg-btn ${statsFilter==='todos'?'active':''}" onclick="statsFilter='todos'; render()">Todos</div>
      <div class="seg-btn ${statsFilter==='amigavel'?'active':''}" onclick="statsFilter='amigavel'; render()">Amigáveis</div>
      <div class="seg-btn ${statsFilter==='campeonato'?'active':''}" onclick="statsFilter='campeonato'; render()">Campeonato</div>
    </div>
    <div class="section-title" style="margin-top:16px;">Resultados Globais</div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;">
      <div class="stat-box"><div class="num" style="color:var(--gold)">${s.wins}</div><div class="lbl">Vitórias</div></div>
      <div class="stat-box"><div class="num" style="color:var(--chalk)">${s.draws}</div><div class="lbl">Empates</div></div>
      <div class="stat-box"><div class="num" style="color:var(--red)">${s.losses}</div><div class="lbl">Derrotas</div></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr; gap:6px;">
      <div class="stat-box" style="padding:10px;"><div class="lbl">Em Casa</div><div class="num mono" style="font-size:16px; margin-top:4px; color:var(--chalk);">${s.casaWins}V &nbsp;${s.casaDraws}E &nbsp;${s.casaLosses}D</div></div>
      <div class="stat-box" style="padding:10px;"><div class="lbl">Fora</div><div class="num mono" style="font-size:16px; margin-top:4px; color:var(--chalk);">${s.foraWins}V &nbsp;${s.foraDraws}E &nbsp;${s.foraLosses}D</div></div>
    </div>
    
    <div class="section-title">Golos e Assistências</div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span style="color:var(--gold); font-weight:bold;">⚽ ${s.scored} Marcados</span>
        <span style="color:var(--red); font-weight:bold;">🥅 ${s.conceded} Sofridos</span>
      </div>
      ${s.scorers.length ? s.scorers.map(sc=>`<div class="scorer-row"><span>${sc.name}</span><span class="n mono">${sc.count} ⚽</span></div>`).join('') : '<div class="empty">Sem golos marcados.</div>'}
    </div>
    <div class="card">
      <div style="margin-bottom:10px; color:var(--muted); font-size:12px; text-transform:uppercase; font-family:'Oswald';">Top Assistências</div>
      ${s.assisters.length ? s.assisters.map(a=>`<div class="scorer-row"><span>${a.name}</span><span class="n mono">${a.count} 🎯</span></div>`).join('') : '<div class="empty">Sem assistências registadas.</div>'}
    </div>

    <div class="section-title">Cartões</div>
    <div class="card">
      ${s.cardRanking.length ? s.cardRanking.map(c=>`<div class="scorer-row"><span>${c.name}</span><span class="n mono">${c.yellow ? `🟨${c.yellow}`:''}${c.yellow&&c.red?' ':''}${c.red ? `🟥${c.red}`:''}</span></div>`).join('') : '<div class="empty">Nenhum cartão registado.</div>'}
    </div>
  `;
}

window.uiAddPlayer = function(){
  const v = (document.getElementById('new-player-input') || {}).value || '';
  if(v.trim()) { state.roster.push({ id: uid(), name: v.trim(), birthDate: null, number: null, active: true }); saveState(); render(); }
};
window.updatePlayerName = function(id, val){ const p=state.roster.find(x=>x.id===id); if(p){p.name=val.trim(); saveState();} };
window.updatePlayerNumber = function(id, val){ const p=state.roster.find(x=>x.id===id); if(p){p.number=parseInt(val)||null; saveState();} };
window.updatePlayerBirthDate = function(id, val){ const p=state.roster.find(x=>x.id===id); if(p){p.birthDate=val||null; saveState(); render();} };
window.removePlayer = function(id){ const p=state.roster.find(x=>x.id===id); if(p){ p.active=false; saveState(); render(); } };

function renderPlantel(){
  const activeRoster = eligiblePlayers();
  return `
    ${topbarHtml('Plantel')}
    <div class="card">
      ${activeRoster.length ? activeRoster.map(p=>{
        const open = expandedPlayer === p.id;
        return `
          <div class="player-item" onclick="if(!event.target.closest('button') && !event.target.closest('input')){ expandedPlayer=expandedPlayer==='${p.id}'?null:'${p.id}'; render(); }">
            <div class="player-row" style="border-bottom:none; padding-bottom:${open?'4px':'10px'};">
              <span style="flex:1;">${p.number ? `<span class="mono" style="color:var(--gold);">#${p.number}</span> ` : ''}${p.name}${p.birthDate ? ` <span style="color:var(--muted); font-size:12px;">- ${computeAge(p.birthDate)} anos</span>` : ''}</span>
            </div>
            ${open ? `
              <div style="padding-bottom:12px; display:flex; flex-direction:column; gap:10px;">
                <div class="field" style="margin-bottom:0;"><label>Nome</label><input type="text" onchange="updatePlayerName('${p.id}', this.value)" value="${p.name}"></div>
                <div class="field" style="margin-bottom:0;"><label>Número</label><input type="number" min="1" max="99" onchange="updatePlayerNumber('${p.id}', this.value)" value="${p.number||''}"></div>
                <div class="field" style="margin-bottom:0;"><label>Data de Nascimento</label><input type="date" onchange="updatePlayerBirthDate('${p.id}', this.value)" value="${p.birthDate||''}"></div>
                <button class="btn btn-outline" style="color:var(--red);" onclick="askConfirm('Remover jogador?', ()=>removePlayer('${p.id}'))">Remover Jogador</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('') : '<div class="empty">Sem jogadores no plantel. Adiciona abaixo.</div>'}
      <div class="add-row">
        <input id="new-player-input" type="text" placeholder="Nome do jogador">
        <button onclick="uiAddPlayer()">+</button>
      </div>
    </div>
  `;
}

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const app = document.getElementById('app');
  const nav = document.getElementById('navbar');
  if(currentTab === 'home'){ nav.style.display = 'none'; app.innerHTML = renderHome(); }
  else {
    nav.style.display = 'flex';
    if(currentTab==='jogo') app.innerHTML = renderJogo();
    else if(currentTab==='calendario') app.innerHTML = renderCalendario();
    else if(currentTab==='treinos') app.innerHTML = renderTreinos();
    else if(currentTab==='jogos') app.innerHTML = renderJogos();
    else if(currentTab==='stats') app.innerHTML = renderStats();
    else if(currentTab==='plantel') app.innerHTML = renderPlantel();
  }
}

setInterval(()=>{
  if(currentTab !== 'jogo') return;
  const m = getActiveMatch(); if(!m || !m.timer || !m.timer.isRunning) return;
  const el = document.getElementById('live-timer'); if(el) el.textContent = formatMatchTime(getMatchElapsedMs(m));
}, 1000);

loadState();
</script>
